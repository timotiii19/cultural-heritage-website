<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <!-- capiz window lattice: diamond panes with a pearly inner pane -->
    <pattern id="capiz" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x=".75" y=".75" width="70.5" height="70.5" stroke="#d6ad68" stroke-opacity=".34" stroke-width="1.5"/>
      <rect x="14" y="14" width="44" height="44" fill="#fffdf2" fill-opacity=".22" stroke="#d6ad68" stroke-opacity=".2" stroke-width="1"/>
    </pattern>

    <!-- parol lantern, hanging string at top -->
    <g id="parol">
      <path d="M0-120V-58" stroke="#8a5a1c" stroke-opacity=".6" stroke-width="1.6"/>
      <path d="M-30 38-52 104-10 50ZM30 38 52 104 10 50Z" fill="#a52d35" fill-opacity=".4" stroke="#a52d35" stroke-opacity=".7" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M-12 52 0 124 12 52Z" fill="#d6ad68" fill-opacity=".5" stroke="#8a5a1c" stroke-opacity=".6" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M0-56 8.4-20.3 39.6-39.6 20.3-8.4 56 0 20.3 8.4 39.6 39.6 8.4 20.3 0 56-8.4 20.3-39.6 39.6-20.3 8.4-56 0-20.3-8.4-39.6-39.6-8.4-20.3Z" fill="#d6ad68" fill-opacity=".42" stroke="#8a5a1c" stroke-opacity=".8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0-34 5-12 26-26 12-5 34 0 12 5 26 26 5 12 0 34-5 12-26 26-12 5-34 0-12-5-26-26-5-12Z" fill="#a52d35" fill-opacity=".45" stroke="#a52d35" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round"/>
      <circle r="8" fill="#fffdf2" fill-opacity=".85" stroke="#8a5a1c" stroke-opacity=".7" stroke-width="1.2"/>
    </g>

    <!-- one swag of festive lights: wire + bulbs in red, gold, green -->
    <g id="swag" stroke-linecap="round">
      <path d="M-300 100Q-150 220 0 100Q150 220 300 100Q450 220 600 100Q750 220 900 100Q1050 220 1200 100Q1350 220 1500 100" stroke="#8a5a1c" stroke-opacity=".5" stroke-width="2"/>
      <g stroke-width="9" stroke-opacity=".8">
        <path d="M-300 100Q-150 220 0 100Q150 220 300 100Q450 220 600 100Q750 220 900 100Q1050 220 1200 100Q1350 220 1500 100" stroke="#a52d35" stroke-dasharray="0.1 78"/>
        <path d="M-300 100Q-150 220 0 100Q150 220 300 100Q450 220 600 100Q750 220 900 100Q1050 220 1200 100Q1350 220 1500 100" stroke="#d6ad68" stroke-dasharray="0.1 78" stroke-dashoffset="-26"/>
        <path d="M-300 100Q-150 220 0 100Q150 220 300 100Q450 220 600 100Q750 220 900 100Q1050 220 1200 100Q1350 220 1500 100" stroke="#2f6b4f" stroke-dasharray="0.1 78" stroke-dashoffset="-52"/>
      </g>
    </g>

    <g id="sparkle"><path d="M0-14 3-3 14 0 3 3 0 14-3 3-14 0-3-3Z" fill="#d6ad68" fill-opacity=".85"/></g>
    <g id="snow-star">
      <path d="M0-10V10M-9-5 9 5M-9 5 9-5" stroke="#d6ad68" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- capiz lattice behind everything -->
  <rect width="1200" height="900" fill="url(#capiz)"/>

  <!-- three staggered light swags -->
  <use href="#swag" transform="translate(0 0)"/>
  <use href="#swag" transform="translate(150 300)"/>
  <use href="#swag" transform="translate(0 600)"/>

  <!-- parols hanging from the swag valleys -->
  <g opacity=".95">
    <use href="#parol" transform="translate(150 256) scale(.8)"/>
    <use href="#parol" transform="translate(750 226) scale(.55)"/>
    <use href="#parol" transform="translate(1050 244) scale(.7)"/>
    <use href="#parol" transform="translate(300 532) scale(.6)"/>
    <use href="#parol" transform="translate(900 550) scale(.75)"/>
    <use href="#parol" transform="translate(450 802) scale(.35)"/>
    <use href="#parol" transform="translate(1050 820) scale(.5)"/>
  </g>

  <!-- falling stars and sparkles -->
  <g>
    <use href="#sparkle" transform="translate(60 330) scale(.8)"/>
    <use href="#sparkle" transform="translate(520 340)"/>
    <use href="#sparkle" transform="translate(1140 400) scale(.7)"/>
    <use href="#sparkle" transform="translate(690 470) scale(.9)"/>
    <use href="#sparkle" transform="translate(240 520) scale(.6)"/>
    <use href="#sparkle" transform="translate(1100 650) scale(.8)"/>
    <use href="#sparkle" transform="translate(60 740) scale(.9)"/>
    <use href="#sparkle" transform="translate(620 780) scale(.7)"/>
    <use href="#sparkle" transform="translate(880 60) scale(.7)"/>
    <use href="#sparkle" transform="translate(380 40) scale(.6)"/>
    <use href="#snow-star" transform="translate(110 230)"/>
    <use href="#snow-star" transform="translate(600 230) scale(.8)"/>
    <use href="#snow-star" transform="translate(960 380)"/>
    <use href="#snow-star" transform="translate(380 450) scale(.9)"/>
    <use href="#snow-star" transform="translate(800 700)"/>
    <use href="#snow-star" transform="translate(180 880) scale(.8)"/>
  </g>
  <g fill="#a52d35" fill-opacity=".6">
    <circle cx="480" cy="300" r="3.5"/>
    <circle cx="1000" cy="520" r="3.5"/>
    <circle cx="330" cy="700" r="3.5"/>
    <circle cx="760" cy="880" r="3.5"/>
  </g>
</svg>
